    const FIXED_ROSTER = FIXED_ROSTER_GROUPS.flatMap(([group, names]) => names.map(name => ({ name, group })))
      .map((person, index) => ({ key: `p${index + 1}`, photoNo: index + 1, ...person }));
    let roster = FIXED_ROSTER;
    let state = null;
    let previousResult = null;
    let toastTimer = null;

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
    const pad = value => String(value).padStart(3, "0");
    const byKey = key => roster.find(person => person.key === key);
    const unique = values => [...new Set(values)];

    function toast(message) {
      const node = $("#toast");
      node.textContent = message;
      node.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => node.classList.remove("show"), 2700);
    }

    function shuffle(list) {
      const result = list.slice();
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function saveState() {
      if (state) localStorage.setItem(STATE_KEY, JSON.stringify(state));
      else localStorage.removeItem(STATE_KEY);
    }

    function restoreState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
        if (saved && saved.version === 2 && saved.rosterCount === roster.length && saved.phase) return saved;
      } catch (_) {}
      return null;
    }

    function displayName(person) {
      if (!person) return "メンバー";
      return person.name || `No. ${pad(person.photoNo)}`;
    }

    function photoMarkup(person, extra = "") {
      const no = pad(person?.photoNo ?? 0);
      return `<div class="photo ${extra}"><div class="photo-missing">${esc(no)}</div><img data-photo="${esc(no)}" alt="${esc(displayName(person))}" loading="eager" hidden></div>`;
    }

    function bindPhotos(root = document) {
      $$("img[data-photo]", root).forEach(img => {
        const no = img.dataset.photo;
        const plainNo = String(Number(no));
        const fileNumbers = [...new Set([no, plainNo])];
        const candidates = PHOTO_DIRS.flatMap(dir => fileNumbers.flatMap(number => PHOTO_EXTS.map(ext => `${dir}${number}.${ext}`)));
        let candidateIndex = 0;
        const tryNext = () => {
          if (candidateIndex >= candidates.length) {
            img.hidden = true;
            return;
          }
          img.src = candidates[candidateIndex++];
        };
        img.onload = () => {
          img.hidden = false;
          const placeholder = img.previousElementSibling;
          if (placeholder) placeholder.hidden = true;
        };
        img.onerror = tryNext;
        tryNext();
      });
    }

    function cardMarkup(key, options = {}) {
      const person = byKey(key);
      if (!person) return "";
      const classes = ["person-card", options.className || ""].filter(Boolean).join(" ");
      const badge = options.badge ? `<span class="pick-badge ${options.badgeClass || ""}">${esc(options.badge)}</span>` : "";
      return `<button type="button" class="${classes}" data-person="${esc(key)}" aria-label="${esc(displayName(person))}">${badge}${photoMarkup(person)}<span class="person-meta"><span class="person-name">${esc(displayName(person))}</span><span class="person-group">${esc(person.group || "")}</span></span></button>`;
    }

    function topActions() {
      const node = $("#topActions");
      if (!state || state.phase === "intro") { node.innerHTML = ""; return; }
      node.innerHTML = `<button class="icon-button" id="resetGame" type="button">最初から</button>`;
      $("#resetGame").addEventListener("click", () => {
        if (confirm("今の選択を消して最初からやり直しますか？")) { state = null; saveState(); render(); }
      });
    }

    function render() {
      $("#topbar").hidden = !state || state.phase === "intro";
      topActions();
      if (!state || state.phase === "intro") renderIntro();
      else if (state.phase === "prelim") renderPrelim();
      else if (state.phase === "four") renderFour();
      else if (state.phase === "duel") renderDuel();
      else if (state.phase === "rank") renderRank();
      else if (state.phase === "result") renderResult();
      saveState();
    }

    function renderIntro() {
      const ranksInLayout = [4, 5, 6, 2, 1, 3, 7, 8, 9];
      const previousGrid = previousResult?.people?.length === 9 ? ranksInLayout.map(rank => {
        const person = previousResult.people[rank - 1];
        const no = pad(person.photoNo);
        return `<div class="result-slot ${rank === 1 ? "center" : ""}"><div class="photo-missing">${esc(no)}</div><img data-photo="${esc(no)}" alt="${esc(person.name || `No. ${no}`)}" loading="eager" hidden><span class="result-rank">${rank}位</span><span class="result-caption">${esc(person.name || `No. ${no}`)}</span></div>`;
      }).join("") : "";
      $("#view").innerHTML = `
        <section class="home-panel">
          <h1 class="home-title">福岡アイドル好き顔9選</h1>
          <button class="button home-start" id="startGame" type="button">スタート</button>
          ${previousGrid ? `<section class="home-previous"><h2 class="home-previous-title">前回の結果</h2><div class="result-grid home-result-grid">${previousGrid}</div></section>` : ""}
        </section>`;
      $("#startGame").addEventListener("click", startGame);
      bindPhotos($("#view"));
    }

    function startGame() {
      if (roster.length < 9) { toast("候補が9人未満です。名簿を確認してください。"); return; }
      const order = shuffle(roster.map(person => person.key));
      state = {
        version: 2, rosterCount: roster.length, phase: "prelim",
        sessionId: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
        prelimOrder: order, prelimBatch: 0, prelimSelected: [],
        fourQueue: [], fourRetry: [], fourGroup: [], fourChoices: [], fourAdvanced: [],
        duelAlive: [], duelEliminated: [], duelWins: {}, pairHistory: [], currentPair: [],
        rankPool: [], ranked: [], rankCandidate: null, rankLow: 0, rankHigh: 0, rankMid: 0
      };
      render();
    }

    function renderPrelim() {
      const batches = [];
      for (let i = 0; i < state.prelimOrder.length; i += 9) batches.push(state.prelimOrder.slice(i, i + 9));
      const batch = batches[state.prelimBatch] || [];
      const selected = new Set(state.prelimSelected);
      const pct = Math.round((state.prelimBatch / Math.max(1, batches.length)) * 100);
      $("#view").innerHTML = `
        <div class="view-head"><div class="view-title"><div class="eyebrow">ROUND 01 · FIRST IMPRESSION</div><h2>気になる顔を選んでね</h2><p class="view-sub">複数選択できます。選ばなかった人はこの段階では再登場しません。</p></div><div class="counter"><strong>${state.prelimBatch + 1} / ${batches.length}</strong><br>表示中の候補 ${batch.length}人</div></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <p class="selection-tip">この画面で選択中：<b>${selected.size}</b>人 · これまでの選択：<b id="prelimCount">${state.prelimSelected.length}</b>人</p>
        <div class="card-grid">${batch.map(key => cardMarkup(key, { className: selected.has(key) ? "selected" : "" , badge: selected.has(key) ? "✓" : "" })).join("")}</div>
        <div class="sticky-actions"><div class="sticky-left"><button class="button ghost" id="prevBatch" type="button" ${state.prelimBatch === 0 ? "disabled" : ""}>← 前へ</button><span class="sticky-info">選択数 ${state.prelimSelected.length}人</span></div><div class="sticky-right"><button class="button" id="nextBatch" type="button">${state.prelimBatch < batches.length - 1 ? "次の9人へ →" : "4人選考へ進む →"}</button></div></div>`;
      bindPhotos($("#view"));
      $$("[data-person]", $("#view")).forEach(button => button.addEventListener("click", () => {
        const key = button.dataset.person;
        const current = new Set(state.prelimSelected);
        if (current.has(key)) current.delete(key); else current.add(key);
        state.prelimSelected = [...current];
        renderPrelim();
        saveState();
      }));
      $("#prevBatch").addEventListener("click", () => { if (state.prelimBatch > 0) { state.prelimBatch--; render(); } });
      $("#nextBatch").addEventListener("click", () => {
        if (state.prelimBatch < batches.length - 1) { state.prelimBatch++; render(); return; }
        if (state.prelimSelected.length < 9) { toast("9選を作るには、最初に少なくとも9人選んでください。"); return; }
        state.phase = "four";
        state.fourQueue = shuffle(state.prelimSelected);
        state.fourRetry = [];
        state.fourAdvanced = [];
        prepareFourGroup();
        render();
      });
    }

    function prepareFourGroup() {
      if (state.fourGroup && state.fourGroup.length) return;
      if (!state.fourQueue.length && state.fourRetry.length) {
        state.fourQueue = shuffle(state.fourRetry);
        state.fourRetry = [];
      }
      state.fourGroup = state.fourQueue.splice(0, 4);
      state.fourChoices = [];
      saveState();
    }

    function renderFour() {
      if (!state.fourGroup.length && (state.fourQueue.length || state.fourRetry.length)) prepareFourGroup();
      const group = state.fourGroup;
      const choices = state.fourChoices;
      const remaining = state.fourQueue.length + state.fourRetry.length + group.length;
      const canDuel = state.fourAdvanced.length >= 9;
      const pct = Math.min(100, Math.round((state.fourAdvanced.length / Math.max(state.prelimSelected.length, 1)) * 100));
      $("#view").innerHTML = `
        <div class="view-head"><div class="view-title"><div class="eyebrow">ROUND 02 · FOUR PICKS</div><h2>好きな顔を1番・2番で選ぶ</h2><p class="view-sub">選ばれなかった候補は、未選択の人同士で再抽選します。</p></div><div class="counter"><strong>${state.fourAdvanced.length}</strong><br>2択候補に進んだ人数</div></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${group.length ? `<p class="selection-tip">カードをタップして、1番好き・2番目に好きな順に選択。選択中：<b>${choices.length} / ${Math.min(2, group.length)}</b></p><div class="card-grid four">${group.map(key => {
          const index = choices.indexOf(key);
          const rank = index === 0 ? "1" : index === 1 ? "2" : "";
          return cardMarkup(key, { className: rank ? (index === 0 ? "rank-first" : "rank-second") : "", badge: rank, badgeClass: index === 0 ? "gold" : "silver" });
        }).join("")}</div>` : `<div class="empty-note">4人選考は完了しました。2択に進めます。</div>`}
        <div class="sticky-actions"><div class="sticky-left"><span class="sticky-info">未選考候補 ${remaining}人${canDuel ? " · 進むと今回は除外" : " · 再抽選できます"}</span></div><div class="sticky-right">${canDuel ? `<button class="button secondary" id="toDuel" type="button">2択へ進む · ${state.fourAdvanced.length}人</button>` : ""}<button class="button" id="confirmFour" type="button" ${group.length && choices.length < Math.min(2, group.length) ? "disabled" : ""}>${group.length ? "選択を確定 →" : "完了"}</button></div></div>`;
      bindPhotos($("#view"));
      $$("[data-person]", $("#view")).forEach(button => button.addEventListener("click", () => {
        const key = button.dataset.person;
        const next = state.fourChoices.slice();
        const existing = next.indexOf(key);
        if (existing >= 0) next.splice(existing, 1);
        else if (next.length < 2) next.push(key);
        else { toast("1番と2番を選んでください。"); return; }
        state.fourChoices = next;
        renderFour();
        saveState();
      }));
      if ($("#confirmFour")) $("#confirmFour").addEventListener("click", () => {
        if (!state.fourGroup.length) return;
        const chosen = state.fourChoices;
        state.fourAdvanced.push(...chosen);
        state.fourRetry.push(...state.fourGroup.filter(key => !chosen.includes(key)));
        state.fourGroup = [];
        state.fourChoices = [];
        prepareFourGroup();
        render();
      });
      if ($("#toDuel")) $("#toDuel").addEventListener("click", enterDuel);
    }

    function enterDuel() {
      state.duelAlive = unique(state.fourAdvanced);
      state.duelEliminated = [];
      state.duelWins = {};
      state.pairHistory = [];
      state.currentPair = [];
      if (state.duelAlive.length < 9) { toast("2択へ進むには候補が9人必要です。"); return; }
      if (state.duelAlive.length === 9) {
        beginFinalRanking();
      } else {
        state.phase = "duel";
        createPair();
      }
      render();
    }

    function beginFinalRanking() {
      state.phase = "rank";
      state.rankPool = shuffle(state.duelAlive);
      state.ranked = [state.rankPool.shift()];
      state.rankCandidate = null;
      state.rankLow = 0;
      state.rankHigh = 0;
      state.currentPair = [];
      prepareRankComparison();
    }

    function prepareRankComparison() {
      if (!state.rankCandidate) {
        if (!state.rankPool.length) {
          state.phase = "result";
          state.currentPair = [];
          return;
        }
        state.rankCandidate = state.rankPool.shift();
        state.rankLow = 0;
        state.rankHigh = state.ranked.length;
      }
      if (state.rankLow >= state.rankHigh) {
        state.ranked.splice(state.rankLow, 0, state.rankCandidate);
        state.rankCandidate = null;
        prepareRankComparison();
        return;
      }
      state.rankMid = Math.floor((state.rankLow + state.rankHigh) / 2);
      state.currentPair = [state.rankCandidate, state.ranked[state.rankMid]];
    }

    function createPair() {
      if (state.duelAlive.length <= 9) {
        state.currentPair = [];
        if (state.duelAlive.length === 9) beginFinalRanking();
        return;
      }
      const available = [];
      for (let i = 0; i < state.duelAlive.length; i++) {
        for (let j = i + 1; j < state.duelAlive.length; j++) {
          const key = [state.duelAlive[i], state.duelAlive[j]].sort().join("|");
          if (!state.pairHistory.includes(key)) available.push([state.duelAlive[i], state.duelAlive[j], key]);
        }
      }
      if (!available.length) state.pairHistory = [];
      const choices = available.length ? available : state.duelAlive.flatMap((a, i) => state.duelAlive.slice(i + 1).map(b => [a, b, [a, b].sort().join("|")]));
      const pair = choices[Math.floor(Math.random() * choices.length)];
      state.currentPair = [pair[0], pair[1]];
      state.pairHistory.push(pair[2]);
    }

    function renderDuel() {
      if (!state.currentPair.length) createPair();
      if (state.phase === "rank") { renderRank(); return; }
      const [a, b] = state.currentPair;
      const completed = state.duelEliminated.length;
      $("#view").innerHTML = `
        <div class="view-head"><div class="view-title"><div class="eyebrow">ROUND 03 · HEAD TO HEAD</div><h2>どちらの顔が好き？</h2><p class="view-sub">好きな方をタップ。9人になるまで2択を続けます。</p></div><div class="counter"><strong>${state.duelAlive.length}</strong><br>あと${state.duelAlive.length - 9}人を選考</div></div>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, completed / Math.max(1, completed + state.duelAlive.length - 9) * 100)}"></div></div>
        <div class="card-grid two">${cardMarkup(a, { className: "duel-card" })}${cardMarkup(b, { className: "duel-card" })}</div><div class="duel-vs">どちらが好き？</div>
        <p class="selection-tip" style="text-align:center">タップしたメンバーが残り、もう一方は今回の選考から外れます。</p>`;
      bindPhotos($("#view"));
      $$("[data-person]", $("#view")).forEach(button => button.addEventListener("click", () => {
        const winner = button.dataset.person;
        const loser = state.currentPair.find(key => key !== winner);
        state.duelAlive = state.duelAlive.filter(key => key !== loser);
        state.duelEliminated.push(loser);
        state.duelWins[winner] = (state.duelWins[winner] || 0) + 1;
        state.currentPair = [];
        createPair();
        render();
      }));
    }

    function renderRank() {
      if (state.phase === "result") { render(); return; }
      const [candidate, compared] = state.currentPair;
      const candidateName = displayName(byKey(candidate));
      const comparedName = displayName(byKey(compared));
      const placed = state.ranked.length;
      const doneComparisons = 9 - state.rankPool.length;
      const pct = Math.round((doneComparisons / 9) * 100);
      $("#view").innerHTML = `
        <div class="view-head"><div class="view-title"><div class="eyebrow">FINAL · HEAD TO HEAD</div><h2>どちらの顔が好き？</h2><p class="view-sub">2人を見比べて選ぶと、その選択から1〜9位が決まります。</p></div><div class="counter"><strong>${Math.min(9, placed)} / 9</strong><br>順位を決定中</div></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <p class="selection-tip" style="text-align:center">より好きな顔をタップしてください。</p>
        <div class="card-grid two">${cardMarkup(candidate, { className: "duel-card" })}${cardMarkup(compared, { className: "duel-card" })}</div><div class="duel-vs">どちらが好き？</div>`;
      bindPhotos($("#view"));
      $$(`[data-person]`, $("#view")).forEach(button => button.addEventListener("click", () => {
        const picked = button.dataset.person;
        if (picked === state.rankCandidate) state.rankHigh = state.rankMid;
        else state.rankLow = state.rankMid + 1;
        state.currentPair = [];
        prepareRankComparison();
        render();
      }));
    }

    function renderResult() {
      rememberResult();
      const ranksInLayout = [4, 5, 6, 2, 1, 3, 7, 8, 9];
      const slots = ranksInLayout.map(rank => {
        const key = state.ranked[rank - 1];
        const person = byKey(key);
        return `<div class="result-slot ${rank === 1 ? "center" : ""}"><div class="photo-missing">${esc(pad(person?.photoNo ?? 0))}</div><img data-photo="${esc(pad(person?.photoNo ?? 0))}" alt="${esc(displayName(person))}" loading="eager" hidden><span class="result-rank">${rank}位</span><span class="result-caption">${esc(displayName(person))}</span></div>`;
      }).join("");
      const text = state.ranked.map((key, index) => {
        const person = byKey(key);
        return `${index + 1}位 ${displayName(person)}${person?.group ? `（${person.group}）` : ""}`;
      }).join("\n");
      $("#view").innerHTML = `
        <div class="view-head"><div class="view-title"><div class="eyebrow">YOUR FUKUOKA IDOL PICKS</div><h2>福岡アイドル好き顔9選</h2><p class="view-sub">中央が1位。周囲に2〜9位を並べています。</p></div><div class="counter"><strong>9</strong><br>人選出</div></div>
        <div class="result-wrap"><div class="result-grid">${slots}</div><p class="result-position">配置：上段 <b>4・5・6位</b> ／ 中段 <b>2・1・3位</b> ／ 下段 <b>7・8・9位</b></p></div>
        <div class="toolbar" style="justify-content:center"><button class="button secondary" id="saveImage" type="button">画像を保存</button><button class="button secondary" id="copyResult" type="button">順位をコピー</button><button class="button" id="again" type="button">もう一度遊ぶ</button></div>`;
      bindPhotos($("#view"));
      $("#saveImage").addEventListener("click", saveResultImage);
      $("#copyResult").addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(text); toast("順位をコピーしました。"); }
        catch (_) { toast(text); }
      });
      $("#again").addEventListener("click", () => { state = null; saveState(); render(); });
    }

    function rememberResult() {
      if (previousResult?.sessionId === state.sessionId) return;
      previousResult = {
        sessionId: state.sessionId,
        people: state.ranked.map(key => {
          const person = byKey(key);
          return { photoNo: person?.photoNo ?? 0, name: person?.name ?? "", group: person?.group ?? "" };
        })
      };
      localStorage.setItem(LAST_RESULT_KEY, JSON.stringify(previousResult));
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = url;
      });
    }

    async function findPhoto(photoNo) {
      const no = pad(photoNo);
      const fileNumbers = [...new Set([no, String(Number(no))])];
      for (const dir of PHOTO_DIRS) {
        for (const number of fileNumbers) {
          for (const ext of PHOTO_EXTS) {
            try { return await loadImage(`${dir}${number}.${ext}`); }
            catch (_) {}
          }
        }
      }
      return null;
    }

    function roundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
    }

    async function makeResultBlob() {
      const canvas = document.createElement("canvas");
      canvas.width = 1080;
      canvas.height = 1320;
      const ctx = canvas.getContext("2d");
      if (!ctx) throw new Error("画像を作成できませんでした。");
      const people = state.ranked.map(key => byKey(key));
      const photos = await Promise.all(people.map(person => findPhoto(person?.photoNo ?? 0)));
      ctx.fillStyle = "#f5f6f8";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#778292";
      ctx.textAlign = "center";
      ctx.font = "700 18px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText("FUKUOKA IDOL · FAVORITE FACE PICKS", 540, 62);
      ctx.fillStyle = "#1d2634";
      ctx.font = "800 42px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText("福岡アイドル好き顔9選", 540, 120);

      const tile = 312, gap = 16, startX = 56, startY = 166;
      const ranksInLayout = [4, 5, 6, 2, 1, 3, 7, 8, 9];
      for (let i = 0; i < ranksInLayout.length; i++) {
        const rank = ranksInLayout[i];
        const person = people[rank - 1];
        const image = photos[rank - 1];
        const col = i % 3, row = Math.floor(i / 3);
        const x = startX + col * (tile + gap);
        const y = startY + row * (tile + gap);
        roundedRect(ctx, x, y, tile, tile, 16);
        ctx.save();
        ctx.clip();
        ctx.fillStyle = "#e9edf1";
        ctx.fillRect(x, y, tile, tile);
        if (image) {
          const scale = Math.max(tile / image.width, tile / image.height);
          const sw = tile / scale, sh = tile / scale;
          const sx = (image.width - sw) / 2, sy = (image.height - sh) / 2;
          ctx.drawImage(image, sx, sy, sw, sh, x, y, tile, tile);
        } else {
          ctx.fillStyle = "#8a96a3";
          ctx.textAlign = "center";
          ctx.font = "800 22px -apple-system, BlinkMacSystemFont, sans-serif";
          ctx.fillText(`No. ${pad(person?.photoNo ?? 0)}`, x + tile / 2, y + tile / 2);
        }
        const gradient = ctx.createLinearGradient(0, y + tile - 104, 0, y + tile);
        gradient.addColorStop(0, "rgba(15,22,31,0)");
        gradient.addColorStop(1, "rgba(15,22,31,.86)");
        ctx.fillStyle = gradient;
        ctx.fillRect(x, y + tile - 106, tile, 106);
        ctx.restore();

        if (rank === 1) {
          ctx.strokeStyle = "#d2a74e";
          ctx.lineWidth = 5;
          roundedRect(ctx, x + 2.5, y + 2.5, tile - 5, tile - 5, 16);
          ctx.stroke();
        }
        ctx.fillStyle = rank === 1 ? "#b88a31" : "rgba(29,38,52,.88)";
        roundedRect(ctx, x + 12, y + 12, 58, 38, 10);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.textAlign = "left";
        ctx.font = "800 17px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText(`${rank}位`, x + 24, y + 37);
        const name = displayName(person);
        const fontSize = name.length > 13 ? 19 : name.length > 8 ? 23 : 27;
        ctx.font = `800 ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
        ctx.fillText(name, x + 14, y + tile - 22, tile - 28);
      }
      return new Promise((resolve, reject) => canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("PNGを作れませんでした。")), "image/png"));
    }

    async function saveResultImage(event) {
      const button = event.currentTarget;
      button.disabled = true;
      button.textContent = "画像を作成中…";
      try {
        const blob = await makeResultBlob();
        const file = new File([blob], "fukuoka-idol-favorite-9.png", { type: "image/png" });
        if (navigator.share && navigator.canShare?.({ files: [file] })) {
          await navigator.share({ files: [file], title: "福岡アイドル好き顔9選" });
          toast("共有メニューから写真に保存できます。");
        } else {
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = file.name;
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          toast("ランキング画像をダウンロードしました。");
        }
      } catch (error) {
        if (error.name !== "AbortError") toast(error.message || "画像を保存できませんでした。");
      } finally {
        button.disabled = false;
        button.textContent = "画像を保存";
      }
    }

    function boot() {
      try { previousResult = JSON.parse(localStorage.getItem(LAST_RESULT_KEY) || "null"); } catch (_) { previousResult = null; }
      state = restoreState();
      render();
    }

    boot();
  </script>
</body>
</html>
